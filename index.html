<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flowers for you 🌸</title>
<meta name="description" content="Someone sent you e-flowers.">
<meta property="og:title" content="Flowers for you 🌸">
<meta property="og:description" content="Someone sent you e-flowers.">
<meta name="theme-color" content="#ffe9f0">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a2b3a;--soft:#8a6475;--rose:#e6397a;--rose-d:#c4245f;--line:#efd9e1;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden}
body{
  min-height:100dvh;color:var(--ink);font:500 16px/1.5 Nunito,system-ui,sans-serif;
  background:
    radial-gradient(60vmax 40vmax at 10% 0%,#fff1c9aa,transparent 60%),
    radial-gradient(60vmax 50vmax at 100% 100%,#ffd0e0aa,transparent 60%),
    linear-gradient(170deg,#fff7f3,#ffe6ee);
  background-attachment:fixed;
}
main{max-width:460px;margin:0 auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom));min-height:100dvh;display:flex}
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;text-align:center;gap:12px}
.screen.on{display:flex;animation:fadeUp .7s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font:700 clamp(30px,8.6vw,40px)/1.14 Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em}
h1 em{font-style:italic;font-weight:500;color:var(--rose)}
p{margin:0}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--rose)}
.sub{color:var(--soft);max-width:34ch;font-size:17px}
.sub em{color:var(--rose);font-weight:700}
.hand{font-family:Caveat,cursive;font-size:23px;line-height:1.15;color:var(--rose-d);min-height:27px}
.tiny{font-size:13px;color:var(--soft)}
.btn{
  appearance:none;border:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;font:800 17px/1 Nunito,system-ui,sans-serif;color:#fff;
  padding:16px 26px;border-radius:999px;background:linear-gradient(180deg,#f0518c,var(--rose-d));
  box-shadow:0 6px 0 #9c1a4a,0 14px 24px -8px #c4245f88;transition:transform .15s,box-shadow .15s;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #9c1a4a}
.btn.ghost{background:#fff;color:var(--soft);box-shadow:0 4px 0 var(--line),0 0 0 1.5px var(--line) inset;font-weight:700;font-size:15px;padding:13px 20px}
.btn.ghost.gave-up{background:linear-gradient(180deg,#f0518c,var(--rose-d));color:#fff;box-shadow:0 6px 0 #9c1a4a}
.btn:focus-visible{outline:3px solid #7aa7ff;outline-offset:3px}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

/* bouquet */
#s-flowers{justify-content:flex-start;padding-top:8px;gap:6px}
#bouquet{width:100%;max-height:64dvh;overflow:visible;user-select:none;touch-action:manipulation}
#whole{transform-origin:200px 545px;animation:breeze 6s ease-in-out infinite alternate}
@keyframes breeze{from{transform:rotate(-1.3deg)}to{transform:rotate(1.3deg)}}
.pt,.grow{transform:scale(0);animation:open 1.1s cubic-bezier(.3,1.35,.5,1) both;animation-delay:calc(var(--d,0)*1s + var(--i,0)*80ms)}
@keyframes open{to{transform:scale(1)}}
.stemline{fill:none;stroke:#5c9a5a;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s ease-out both;animation-delay:calc(var(--d,0)*1s)}
@keyframes draw{to{stroke-dashoffset:0}}
.fl{cursor:pointer}
.sway{animation:sway 4.5s ease-in-out infinite alternate;animation-delay:calc(var(--d,0)*-1s)}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.fl.wig .sway{animation:wig .55s ease}
@keyframes wig{25%{transform:rotate(-15deg) scale(1.1)}60%{transform:rotate(12deg) scale(1.1)}}
.wrap{animation:rise 1s cubic-bezier(.2,.8,.3,1) both}
@keyframes rise{from{transform:translateY(70px);opacity:0}}
#next{opacity:0;animation:fadeUp .8s 5.2s ease both,pulse 1.6s 6s ease-in-out infinite}

/* the ask */
.ecg{width:min(280px,76%);overflow:visible}
.ecg path{fill:none;stroke:var(--rose);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.on .ecg path{animation:draw 2s .3s ease-out forwards}
.ecg .hrt{fill:var(--rose);stroke:none;transform-box:fill-box;transform-origin:center;opacity:0}
.on .ecg .hrt{animation:pop .5s 2s forwards,beat 1s 2.6s infinite}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
.cheers{width:190px;overflow:visible}
.cheers .tl{transform-origin:70px 120px;animation:clinkL 1.8s ease-in-out infinite}
.cheers .tr{transform-origin:130px 120px;animation:clinkR 1.8s ease-in-out infinite}
@keyframes clinkL{0%,60%,100%{transform:rotate(-20deg)}30%{transform:rotate(-9deg)}}
@keyframes clinkR{0%,60%,100%{transform:rotate(20deg)}30%{transform:rotate(9deg)}}
.cheers .spark{opacity:0;animation:spark 1.8s ease-in-out infinite}
@keyframes spark{25%{opacity:0}32%{opacity:1}55%{opacity:0}}
.choices{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:64px;margin-top:6px}
#yes{transform:scale(var(--grow,1));transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
#no{transition:transform .28s cubic-bezier(.34,1.4,.64,1);position:relative;z-index:5}

#petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.petal{position:absolute;top:-30px;width:16px;height:22px;border-radius:80% 0 80% 0;opacity:.85;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),112vh,0) rotate(var(--rot))}}
.heart{position:fixed;z-index:30;pointer-events:none;color:var(--rose);animation:floatUp 1s ease-out forwards}
@keyframes floatUp{to{transform:translate(var(--hx),-90px) scale(1.5);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,90px);z-index:40;background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;transition:transform .35s;white-space:nowrap}
#toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){
  .pt,.grow,.stemline,.wrap,.sway,#whole,.pulse,.cheers *{animation:none!important;transform:none;stroke-dashoffset:0}
  #next{animation:none;opacity:1}
  .cheers .tl{transform:rotate(-14deg)}.cheers .tr{transform:rotate(14deg)}
}
</style>
</head>
<body>
<main>
  <!-- 1 · the flowers -->
  <section class="screen on" id="s-flowers">
    <p class="eyebrow">Special delivery</p>
    <h1 id="hello"></h1>
    <svg id="bouquet" viewBox="0 8 400 552" role="img" aria-label="A bouquet of lilies in many colours"></svg>
    <p class="hand" id="caption">tap the flowers 🌸</p>
    <button class="btn" id="next">One more thing →</button>
  </section>

  <!-- 2 · the ask -->
  <section class="screen" id="s-ask">
    <p class="eyebrow" id="askEyebrow"></p>
    <svg class="ecg" viewBox="0 0 300 70" aria-hidden="true">
      <path pathLength="1" d="M0 40H92l8-7 8 7h12l9-30 11 52 9-34 6 12h40"/>
      <path class="hrt" d="M232 30c0-9 12-11 15-2 3-9 15-7 15 2 0 10-15 19-15 19s-15-9-15-19z"/>
    </svg>
    <h1 id="askTitle">I'm terrible with needles… but I'd love to take a <em>shot</em> with you.</h1>
    <svg class="cheers" viewBox="0 0 200 135" aria-hidden="true">
      <g class="spark" stroke="#e6397a" stroke-width="3" stroke-linecap="round"><path d="M100 8V22M82 14l6 12M118 14l-6 12"/></g>
      <g class="tl"><path d="M56 34V104a14 14 0 0 0 28 0V34Z" fill="#ffffffaa" stroke="#cdb9c6" stroke-width="1.5"/><path d="M57.5 62V104a12.5 12.5 0 0 0 25 0V62Z" fill="#ff9dbb" opacity=".75"/><rect x="54" y="30" width="32" height="6" rx="3" fill="#b79ae0"/><path d="M62 42V98" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/><path d="M76 20L72 100" stroke="#e6397a" stroke-width="3" stroke-linecap="round"/></g>
      <g class="tr"><path d="M116 34V104a14 14 0 0 0 28 0V34Z" fill="#ffffffaa" stroke="#cdb9c6" stroke-width="1.5"/><path d="M117.5 58V104a12.5 12.5 0 0 0 25 0V58Z" fill="#ffc94d" opacity=".75"/><rect x="114" y="30" width="32" height="6" rx="3" fill="#e0425a"/><path d="M122 42V98" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/><path d="M124 20L128 100" stroke="#5fb878" stroke-width="3" stroke-linecap="round"/></g>
    </svg>
    <p class="sub" id="askSub">You draw blood all day — let me draw you out for <em>drinks</em>? I promise it won't be in <span style="white-space:nowrap"><em>vein</em>. 🥂</span></p>
    <p class="tiny" id="fine">*Full disclosure: I don't really drink — I'll probably just have a beer. "Shots" sounded cooler.</p>
    <div class="choices" id="choices">
      <button class="btn" id="yes">Yes — you're my type 🥂</button>
      <button class="btn ghost" id="no">No</button>
    </div>
    <button class="btn pulse" id="send" hidden></button>
    <p class="tiny" id="ps"></p>
  </section>
</main>
<div id="petals" aria-hidden="true"></div>
<div id="toast" role="status"></div>

<script>
/* ✏️ names */
const CONFIG = { herName: 'Julia', myName: 'Apurv' };

const $ = s => document.querySelector(s);
const her = CONFIG.herName.trim(), me = CONFIG.myName.trim();

/* ---------- lilies ---------- */
const PETAL = 'M0 2C10-4 19-22 13-38C10-46 4-52 0-58C-4-52-10-46-13-38C-19-22-10-4 0 2Z';
const BAND = 'M0-4C6-14 7-34 0-50C-7-34-6-14 0-4Z';
const SPECKS = [[-3,-14],[3,-18],[-2,-24],[4,-29],[0,-34],[-5,-21],[2,-11],[-1,-40],[6,-23],[-6,-30]];
const KINDS = {
  stargazer: { name:'Stargazer lily — the diva of the bunch', g:['#f59ac0','#ffd3e3','#fff6f9'], band:'#e0266f', edge:'#f3a9c3', speck:'#7d0f3c', anther:'#9a4a1a', throat:'#cfe58a' },
  casablanca:{ name:'Casablanca lily — "of all the Hinge profiles in all the world…"', g:['#e3f0bd','#ffffff','#ffffff'], edge:'#dcc8d2', anther:'#c9641c', throat:'#b9d87a' },
  tiger:     { name:'Tiger lily — freckled and fierce', g:['#ff6a13','#ff8f2e','#ffb765'], band:'#ff741a', edge:'#e8741a', speck:'#4a1408', anther:'#4a2210', throat:'#ffd766' },
  yellow:    { name:'Asiatic lily — pure sunshine', g:['#ffa800','#ffd93b','#fff1a6'], edge:'#eab92d', speck:'#a65a00', anther:'#8a4b1f', throat:'#c8e07a' },
  pink:      { name:'Oriental lily — soft and sweet', g:['#ff8fb3','#ffc1d5','#ffeaf1'], band:'#ff85ab', edge:'#f3a9c3', anther:'#b5541a', throat:'#d4e88f' },
  plum:      { name:'Night-flyer lily — a little mysterious', g:['#4f0c33','#8e1d57','#c4477f'], band:'#650f40', edge:'#6d1244', anther:'#f2b632', throat:'#2d061c' },
  peach:     { name:'Peach lily — just peachy', g:['#ff9270','#ffc09c','#ffe8d6'], edge:'#f0a683', anther:'#a84d17', throat:'#d4e88f' },
  blush:     { name:'Blushing lily — same, honestly', g:['#ffc2d6','#fff7fa','#ffffff'], band:'#ffd0df', edge:'#e6c5d1', anther:'#c9641c', throat:'#cfe58a' },
};
function lily(k){
  const c = KINDS[k]; let s = '';
  for (let layer = 0; layer < 2; layer++) for (let i = 0; i < 3; i++)
    s += `<g transform="rotate(${i*120 + layer*60}) scale(${layer ? '1.1 1' : '.92 1.05'})"><g class="pt" style="--i:${layer*3 + i}">
      <path d="${PETAL}" fill="url(#g-${k})" stroke="${c.edge}" stroke-width="1"/>
      ${c.band ? `<path d="${BAND}" fill="${c.band}" opacity=".82"/>` : ''}
      <path d="M0-5C1.5-20 1-36 0-52" fill="none" stroke="${c.band || c.edge}" stroke-width="1.2" stroke-linecap="round" opacity=".6"/>
      ${c.speck ? SPECKS.map(([x,y]) => `<circle cx="${x}" cy="${y}" r="1.1" fill="${c.speck}"/>`).join('') : ''}</g></g>`;
  s += `<g class="grow" style="--i:9"><circle r="6.5" fill="${c.throat}"/>`;
  for (let i = 0; i < 6; i++)
    s += `<g transform="rotate(${i*60 + 30})"><path d="M0 0Q4-12 0-25" fill="none" stroke="${c.throat}" stroke-width="1.6"/>
      <ellipse cx="0" cy="-27" rx="2.4" ry="5.5" fill="${c.anther}" transform="rotate(${i%2 ? 30 : -30} 0 -27)"/></g>`;
  return s + `<circle r="2.6" fill="#f4f8d8"/></g>`;
}
const calla = (fill, inner, edge) => `<g class="grow"><path d="M0 0C-10-8-31-30-27-59C-24-79-5-91 15-98C12-85 31-71 31-46C31-22 12-6 0 0Z" fill="${fill}" stroke="${edge}" stroke-width="1.4"/>
  <path d="M2-9C-9-24-15-46-7-62C1-76 10-85 15-98C12-85 31-71 31-46C31-22 12-6 2-9Z" fill="${inner}"/>
  <path d="M2-9C-9-24-15-46-7-62C1-76 10-85 15-98" fill="none" stroke="${edge}" stroke-width="1.4"/>
  <path d="M7-20C5-36 8-52 13-64" fill="none" stroke="#f4b52a" stroke-width="7.5" stroke-linecap="round"/></g>`;
const bud = (a, b) => `<g class="grow"><path d="M0 0C-10-12-9-36 0-52C9-36 10-12 0 0Z" fill="${a}" stroke="${b}" stroke-width="1.2"/>
  <path d="M0-3C-3-18-2-36 0-50M0-3C4-16 5-30 3-42" fill="none" stroke="${b}" stroke-width="1" opacity=".7"/><path d="M-5 2C-3-4 3-4 5 2Z" fill="#6fb06b"/></g>`;
const BELL = 'M0 0C-7 0-8 7-7 11L-4 9.3L0 12L4 9.3L7 11C8 7 7 0 0 0Z';
const valley = () => `<g class="grow"><path d="M0 0C0-30-8-52-40-58" fill="none" stroke="#5c9a5a" stroke-width="2.4" stroke-linecap="round"/>` +
  [[-1,-14,1],[-3.6,-28,1],[-10,-41,.92],[-20,-50.6,.82],[-33,-56,.7],[-40,-58,.55]].map(([x,y,k]) =>
    `<path d="M${x} ${y}q-3 3-5 8" fill="none" stroke="#5c9a5a" stroke-width="1.3"/><path transform="translate(${x-5} ${y+8}) scale(${k}) rotate(12)" d="${BELL}" fill="#fff" stroke="#c9d8bd" stroke-width="1.1"/>`).join('') + `</g>`;
const breath = () => `<g class="grow">` + [[0,0,4],[-9,5,3.2],[8,6,3.4],[-3,-9,3],[10,-6,2.8],[-12,-5,2.6]].map(([x,y,r]) =>
  `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="#ead7df" stroke-width=".8"/><circle cx="${x}" cy="${y}" r="${r*.3}" fill="#ffe08a"/>`).join('') + `</g>`;

/* x, y, scale, rotation, bloom-delay(s) */
const BACK = [
  ...[[44,262],[356,262],[108,112],[300,106],[200,34],[160,30],[244,28]].map(([x,y], i) => ({ art:breath, name:"Baby's breath — for the soft bits", x, y, s:1.15, r:0, d:1.3 + i*.1 })),
  { art:() => calla('#fffdf8','#f7ecdc','#dcc9bb'), name:'Calla lily — elegant, a little dramatic', x:84,  y:222, s:1.1, r:-30, d:1.0 },
  { art:() => calla('#f7a8c6','#e87aa6','#cf5c8b'), name:'Pink calla lily — dressed up for you',   x:318, y:222, s:1.1, r:24,  d:1.2, flip:1 },
  { art:() => bud('#d9ecb4','#9cc77f'), name:'A lily bud — give it time', x:150, y:78, s:1.15, r:-16, d:1.5 },
  { art:() => bud('#ffc9da','#e88aac'), name:'A lily bud — give it time', x:256, y:74, s:1.15, r:14,  d:1.6 },
  { art:valley, name:'Lily of the valley — tiny bells that ring when you text back', x:74,  y:330, s:1.45, r:-8, d:1.7 },
  { art:valley, name:'Lily of the valley — tiny bells that ring when you text back', x:326, y:330, s:1.45, r:8,  d:1.8, flip:1 },
];
const LILIES = [
  ['casablanca',200,128,1.2,0],['plum',120,180,1.05,20],['tiger',282,178,1.08,-15],['yellow',88,276,.98,10],
  ['pink',314,276,.98,35],['blush',140,334,.95,-10],['peach',262,334,.95,15],['stargazer',200,242,1.35,30],
].map(([k,x,y,s,r], i) => ({ k, art:() => lily(k), name:KINDS[k].name, x, y, s, r, d:2 + i*.36, shadow:1 }));

function buildBouquet(){
  const grads = Object.entries(KINDS).map(([k,c]) => `<linearGradient id="g-${k}" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="${c.g[0]}"/><stop offset=".45" stop-color="${c.g[1]}"/><stop offset="1" stop-color="${c.g[2]}"/></linearGradient>`).join('');
  const leaves = [[-64,.78],[-47,.95],[-30,1.05],[-12,1.1],[12,1.1],[30,1.05],[47,.95],[64,.78]].map(([a,l], i) =>
    `<g transform="translate(200 420) rotate(${a}) scale(${l})"><g class="grow" style="--d:${.5 + i*.06}"><path d="M0 0C-17-70-12-200 0-262C12-200 17-70 0 0Z" fill="url(#leaf)"/><path d="M0-6V-250" stroke="#8cc487" stroke-width="1.4" opacity=".7"/></g></g>`).join('');
  const all = [...BACK, ...LILIES];
  const stems = all.map(f => `<path class="stemline" pathLength="1" style="--d:${Math.max(.3, f.d - .9)}" d="M200 440Q${(200 + f.x)/2 + (f.x - 200)*.25} ${f.y + 90} ${f.x} ${f.y}"/>`).join('');
  const flowers = all.map((f, i) => `<g transform="translate(${f.x} ${f.y})"><g class="fl" data-i="${i}" ${f.shadow ? 'filter="url(#sh)"' : ''} style="--d:${f.d}"><g class="sway" style="--d:${(i * .7) % 4}">
    <g transform="rotate(${f.r}) scale(${f.flip ? -f.s : f.s} ${f.s})" style="--d:${f.d}">${f.art()}</g></g></g></g>`).join('');
  $('#bouquet').innerHTML = `<defs>${grads}
    <linearGradient id="leaf" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3f7d45"/><stop offset="1" stop-color="#7dbb74"/></linearGradient>
    <linearGradient id="paperL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#f7e3d3"/></linearGradient>
    <linearGradient id="paperR" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fbeadf"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#5a1436" flood-opacity=".28"/></filter></defs>
    <g id="whole">
      <g class="wrap"><path d="M82 318L200 286L318 318L200 548Z" fill="#f6d9e3" stroke="#e9b9ca" stroke-width="1.5"/></g>
      ${leaves}${stems}${flowers}
      <g class="wrap">
        <path d="M74 322C112 352 168 384 232 402L204 550Z" fill="url(#paperL)" stroke="#e6cdb9" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M326 322C288 352 236 382 172 402L196 550Z" fill="url(#paperR)" stroke="#e6cdb9" stroke-width="1.5" stroke-linejoin="round"/>
        <g transform="translate(200 470)" fill="#e6397a" stroke="#b81f5c" stroke-width="1.3" stroke-linejoin="round">
          <path d="M-3 4C-14 22-20 40-18 58L-8 50L-2 60C-4 40 0 20 3 4Z"/><path d="M3 4C14 22 20 40 18 58L8 50L2 60C4 40 0 20-3 4Z" fill="#f0518c"/>
          <path d="M0 0C-16-20-42-20-40-2C-38 14-14 10 0 0Z"/><path d="M0 0C16-20 42-20 40-2C38 14 14 10 0 0Z" fill="#f0518c"/>
          <rect x="-8" y="-8" width="16" height="16" rx="5"/></g>
      </g>
    </g>`;
  return all;
}

/* ---------- page 1 ---------- */
$('#hello').innerHTML = `Here are your e‑flowers${her ? ', <em>' + her + '</em>' : ''} 💐`;
const ALL = buildBouquet();
$('#bouquet').addEventListener('click', e => {
  const fl = e.target.closest('.fl'); if (!fl) return;
  fl.classList.remove('wig'); void fl.getBoundingClientRect(); fl.classList.add('wig');
  $('#caption').textContent = ALL[fl.dataset.i].name;
  hearts(e.clientX, e.clientY);
});
const drift = setInterval(() => rain(1, 0), 1300);
$('#next').onclick = () => {
  clearInterval(drift);
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === 's-ask'));
  window.scrollTo(0, 0);
};

/* ---------- page 2 ---------- */
$('#askEyebrow').textContent = her ? `One more thing, ${her}` : 'One more thing';
const NO_TEXT = ['No', 'Hard stick — try again', 'Missed the vein', 'Oops, that one rolled', 'Still no?', "Tourniquet's getting tight…"];
let noCount = 0, lastDodge = -1e9;
const yesBtn = $('#yes'), noBtn = $('#no');
function dodge(e){
  if (noBtn.classList.contains('gave-up')) return;
  e.preventDefault();
  // one tap = one dodge: a phone tap fires pointerdown AND click, so ignore anything within 350ms
  if (e.timeStamp - lastDodge < 350) return;
  lastDodge = e.timeStamp;
  if (navigator.vibrate) navigator.vibrate(25);
  if (++noCount >= NO_TEXT.length){
    noBtn.textContent = 'okay fine, YES 🥂'; noBtn.classList.add('gave-up'); noBtn.style.transform = '';
    setTimeout(() => noBtn.onclick = sayYes, 600); // after this tap's own click has passed, so she sees it give up first
    return;
  }
  noBtn.textContent = NO_TEXT[noCount];
  yesBtn.style.setProperty('--grow', 1 + noCount * .05);
  // measure the un-moved spot with transitions off, so rapid taps mid-flight can't drift it off-screen
  const prev = noBtn.style.transform;
  noBtn.style.transition = 'none'; noBtn.style.transform = 'none';
  const r = noBtn.getBoundingClientRect(), y = yesBtn.getBoundingClientRect(), pad = 12;
  noBtn.style.transform = prev; void noBtn.offsetWidth; noBtn.style.transition = '';
  let L, T, tries = 0;
  do {
    L = pad + Math.random() * Math.max(1, innerWidth - r.width - pad * 2);
    T = pad + Math.random() * Math.max(1, innerHeight - r.height - pad * 2);
  } while (++tries < 20 && L < y.right + 16 && L + r.width > y.left - 16 && T < y.bottom + 16 && T + r.height > y.top - 16);
  noBtn.style.transform = `translate(${L - r.left}px,${T - r.top}px) rotate(${(Math.random() * 16 - 8) | 0}deg)`;
}
noBtn.addEventListener('pointerdown', dodge);
noBtn.addEventListener('mouseenter', e => { if (matchMedia('(hover:hover)').matches) dodge(e); });
noBtn.addEventListener('click', e => { if (noBtn.classList.contains('gave-up')) return; e.detail === 0 ? dodge(e) : e.preventDefault(); }); // detail 0 = keyboard
yesBtn.onclick = sayYes;

function sayYes(){
  $('#askEyebrow').textContent = 'Result · positive';
  $('#askTitle').innerHTML = `It's a <em>date!</em> 🥂`;
  $('#askSub').innerHTML = `Best result I've had all week. First round's on me — just tell me when you're free.`;
  $('#choices').remove(); $('#fine').remove();
  $('#send').hidden = false; $('#send').textContent = `Tell ${me || 'me'} 💌`;
  $('#ps').innerHTML = `P.S. I'm B-positive we'll have fun.<br>P.P.S. The lab says I need a number on file to schedule this. Yours would do nicely. 📱`;
  hearts(innerWidth / 2, innerHeight / 2);
  rain(70, 60); setInterval(() => rain(4, 0), 900);
}
$('#send').onclick = async () => {
  const text = `Results are in: it's a YES 🥂🌸${her ? ' — ' + her : ''}\n📱 My number: `;
  try {
    if (navigator.share) return await navigator.share({ text });
    await navigator.clipboard.writeText(text); toast(`Copied! Now paste it to ${me || 'me'} 😌`);
  } catch (err) { if (err.name !== 'AbortError') toast(`Just text ${me || 'me'}: "yes" 🌸`); }
};

/* ---------- floaty bits ---------- */
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2600); }
function hearts(x, y){
  for (let k = 0; k < 5; k++){
    const h = document.createElement('span');
    h.className = 'heart'; h.textContent = '♥';
    h.style.cssText = `left:${x - 8}px;top:${y - 10}px;--hx:${(Math.random() * 90 - 45) | 0}px;animation-delay:${k * 70}ms;font-size:${14 + Math.random() * 12}px`;
    document.body.appendChild(h); setTimeout(() => h.remove(), 1500);
  }
}
const PETAL_COLORS = ['#ffd6e4', '#e6397a', '#ffffff', '#ffa94d', '#ffd23f', '#ff9dbb'];
function rain(n, gap){
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) n = Math.min(n, 6);
  for (let i = 0; i < n; i++) setTimeout(() => {
    const p = document.createElement('i'), k = .6 + Math.random() * .9;
    p.className = 'petal';
    p.style.cssText = `left:${Math.random() * 100}vw;background:${PETAL_COLORS[(Math.random() * PETAL_COLORS.length) | 0]};width:${16 * k}px;height:${22 * k}px;
      --dx:${(Math.random() * 160 - 80) | 0}px;--rot:${(Math.random() * 720 - 360) | 0}deg;animation-duration:${5 + Math.random() * 4}s`;
    $('#petals').appendChild(p); setTimeout(() => p.remove(), 9500);
  }, i * gap);
}
</script>
</body>
</html>
